version: 2

models:
  - name: stg_facebook_ads_campaign
    description: Facebook campaign history
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - campaign_id
              - campaign_updated_at
    columns:
      - name: campaign_id
        description: The unique identifier for the Facebook campaign
        data_tests:
          - not_null
          - unique
      - name: campaign_name
        description: The name of the Facebook campaign
      - name: campaign_updated_at
        description: The last time the Facebook campaign was updated
        data_tests:
          - not_null