version: 2

models:
  - name: stg_facebook_ads_ads_stats
    description: Facebook daily stats aggregated at the ad level
    columns:
      - name: ad_id
        data_tests:
          - not_null
      - name: account_id
        description: The account ID associated with the ad
      - name: ad_spend
        description: The amount spent on the ad for the given date
      - name: ad_clicks
        description: The number of clicks on the ad for the given date
      - name: ad_impressions
        description: The number of times the ad was shown for the given date
      - name: ad_date
        description: The date for which the ad stats are recorded
        data_tests:
          - not_null