unified_marketing_model:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  
  meta:
    base: &base
      type: databricks
      threads: 8
    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      threads: 8
      connect_retries: 30
      retry_all: true

  outputs:
    dev: &dev_service_account
      <<: *base
      host: "{{ env_var('DEV_HOST') }}"
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"

    ci: &ci_service_account
      <<: *base_auth
      catalog: ci_development
      schema: "{{ env_var('DEV_SCHEMA') }}"
      host: "{{ env_var('DEV_HOST') }}"
      http_path: "{{ env_var('DEV_HTTP_PATH') }}"

    staging: &staging_service_account
      <<: *ci_service_account
      catalog:
      schema:
      http_path:

    production: &production_service_account
      <<: *base_auth
      catalog:
      schema: 
      host:
      http_path:

      
## DATABRICKS ##
## By default, edr expects the profile name 'elementary'.      ##
## Configure the database and schema of elementary models.     ##
## Check where 'elementary_test_results' is to find it.        ##

elementary:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      <<: *dev_service_account
      catalog: bronze_development
      schema: elementary
    production:
      <<: *production_service_account
      catalog: silver_production
      schema: elementary

    staging:
      <<: *staging_service_account
      catalog: silver_staging
      schema: elementary